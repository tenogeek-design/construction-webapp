
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#202226">

  <title>CONSTRUCTION GROUP — Бригадир</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #202226;
      color: #f5f5f4;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px;
      background: #292c31;
      border-bottom: 1px solid #3b3f46;
    }

    .brand {
      color: #ff812e;
      font-size: 20px;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: #292c31;
      border: 1px solid #3b3f46;
      border-radius: 12px;
      padding: 25px;
      margin-top: 20px;
    }

    .balance {
      color: #ff812e;
      font-size: 36px;
      font-weight: bold;
      margin-top: 12px;
    }

    .muted {
      color: #a4a7ad;
    }

    button {
      background: #ff812e;
      color: #202226;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">CONSTRUCTION GROUP</div>
    <div class="muted">Кабинет бригадира</div>
  </header>

  <main>
    <h1>Панель бригадира</h1>
    <p class="muted">Управление бригадой и финансами</p>

    <section class="card">
      <h2>Моя касса</h2>
      <p class="muted">Доступный баланс</p>

      <div class="balance" id="myBalance">
        Загрузка...
      </div>

      <p id="cashboxName" class="muted"></p>

      <button id="refreshBalance">
        Обновить баланс
      </button>
   
   </section>
    
    <section class="card">
      <h2>История операций</h2>
      <p class="muted">
        Поступления и расходы моей кассы
      </p>

      <div id="myFinanceHistory">
        Загрузка истории...
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="foreman.js"></script>
</body>
</html>
