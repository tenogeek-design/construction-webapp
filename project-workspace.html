<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1b27">
<title>CONSTRUCTION GROUP — Карточка объекта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d1722;--card:rgba(25,40,56,.97);--sub:#25384d;--line:#405c73;--muted:#b7c8d8;--blue:#85c7f3;--orange:#f6ad73;--text:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:14px Manrope,Arial,sans-serif;min-height:100vh;background:linear-gradient(90deg,#0b1520f3,#0e1b2ce5 70%,#0e1d2ab9),url('/owner-facade.jpg') center/cover fixed}
button,input,select{font:inherit}
button{border:1px solid #54738e;border-radius:11px;background:#2c465e;color:#eff6fd;padding:11px 17px;cursor:pointer;font-weight:700;transition:.15s}
button:hover:not(:disabled){background:#385977;border-color:#e5a371}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.main{background:linear-gradient(120deg,#f8ba86,#df8d4f);border:1px solid #ffcd9e;color:#182531}
button.danger{border-color:#ab6970;color:#ffb6b5;background:#4d2d39}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1290px;margin:auto;padding:22px 24px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid #60778b76;padding-bottom:20px;margin-bottom:30px}
.brand{display:flex;align-items:center;gap:14px}
.symbol{width:52px;height:50px;display:grid;place-items:center}
.symbol svg{width:100%;height:100%}
.brand strong{display:block;font-weight:800;letter-spacing:1px;font-size:15px}
.brand strong span{color:#75bdfa}
.brand small{display:block;color:#abc1d4;letter-spacing:2px;font-size:10px;margin-top:3px}
.back{font-size:12px;color:#c7d9e9;border:1px solid #4f7189;padding:10px 13px;border-radius:10px;background:#20354bd4}
.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin:25px 0}
.kicker{font-weight:800;letter-spacing:1.7px;font-size:11px;color:var(--orange)}
h1{font-size:clamp(27px,3.2vw,43px);margin:8px 0;line-height:1.2;letter-spacing:-1px}
.hero p{color:#c1d0de;line-height:1.65;margin:5px 0}
.chip{display:inline-flex;align-items:center;background:#254d3d;color:#afe3c5;padding:8px 12px;border-radius:11px;font-size:12px;font-weight:800;white-space:nowrap}
.chip.planned{background:#384251;color:#c8d8e9}.chip.paused{background:#5a4a2e;color:#ffe5b2}.chip.completed{background:#245747;color:#aeeac7}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}
.metric,.panel{background:var(--card);border:1px solid #46617b;border-radius:16px;padding:21px;box-shadow:0 15px 38px #0004;backdrop-filter:blur(14px)}
.metric small{display:block;color:#afc1d2;font-size:12px;margin-bottom:8px}
.metric strong{font-size:23px;color:white}
.metric strong.orange{color:var(--orange)}
.nav{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:22px 0}
.nav button{background:#263c50}
.nav button.active{background:#355d7b;border-color:#9bc3db;color:#fff}
.panel h2{font-size:21px;margin:0 0 11px}
.note{color:#b6c9d9;font-size:12px;line-height:1.75}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.data{padding:15px;background:#22364c;border:1px solid #445f79;border-radius:12px;min-width:0}
.data small{display:block;color:#b0c2d1;margin-bottom:7px}
.data b{font-size:14px;overflow-wrap:anywhere}
.section-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stage{border:1px solid #4b6883;border-radius:15px;background:#1c3044;margin:13px 0;overflow:hidden}
.stage>button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:0;padding:19px;text-align:left;background:#21374d;color:#fff;gap:12px}
.stage>button strong{font-size:16px}
.stage .body{padding:16px}
.stage .body[hidden]{display:none}
.progress{height:7px;border-radius:20px;background:#455871;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,#5c9ccc,#f2ac75);border-radius:20px}
.work{padding:14px 8px;border-top:1px solid #40576f;display:grid;grid-template-columns:minmax(160px,1.7fr) minmax(110px,1fr) minmax(105px,1fr);gap:12px;align-items:center}
.work:first-child{border-top:0}
.work b{display:block;font-size:13px}
.work small{display:block;color:#b9cbda;font-size:11px;line-height:1.75}
.work .money{text-align:right;font-size:14px;font-weight:800;color:#f6b27d}
.stageTotal{text-align:right;color:#f6b27d;font-weight:800;margin:17px 4px 0}
form{display:grid;gap:12px}
label{display:grid;gap:7px;font-weight:700;font-size:12px;color:#c4d4e2}
select,input{background:#142639;color:#f3f7fb;border:1px solid #597793;border-radius:11px;padding:13px;width:100%;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.warning{background:#3e302c;border:1px solid #86674d;border-radius:12px;padding:14px;color:#fbd4b4;font-size:12px;line-height:1.6}
.empty{background:#23374a;border:1px dashed #5c7691;border-radius:12px;padding:22px;text-align:center;color:#bacddd;line-height:1.75}
.status{margin-top:12px;color:#d7c3a9;min-height:20px}
.listCard{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#22374b;border:1px solid #49647d;border-radius:13px;padding:16px;margin:12px 0}
.listCard h3{margin:0 0 7px;font-size:16px}
.listCard p{margin:0;color:#bed0de;font-size:12px}
@media(max-width:760px){.wrap{padding:16px 13px 44px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric,.panel{padding:15px}.metric strong{font-size:19px}.top{flex-wrap:wrap}.work{grid-template-columns:1fr 1fr}.work>div:first-child{grid-column:1/-1}.hero{flex-wrap:wrap}.listCard{flex-wrap:wrap}.grid2{grid-template-columns:1fr}}

/* Вечерний отчёт */
#dailyPanel h3{font-size:17px}
#dailyPanel h4{font-size:14px}
.dailyForm,.dailyReport{background:#1b2d40;border:1px solid #4a6681;border-radius:14px;padding:17px;margin:15px 0}
.dailyLine{display:grid;grid-template-columns:minmax(135px,1.1fr) minmax(170px,2fr) minmax(115px,1fr) auto;gap:9px;align-items:end;margin:9px 0}
.dailyLine button{padding:11px 15px}
.dailyCashDecision,.dailyPhotoBox,.dailyCash{padding:14px;border:1px solid #526a82;background:#25394e;border-radius:12px;margin:14px 0}
.dailyCheck{display:flex;flex-direction:row;align-items:center;gap:10px}
.dailyCheck input{width:18px;height:18px}
.dailyEntry{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #385068}
.dailyEntry span{color:#f0b38a;font-weight:800;white-space:nowrap}
.dailyPhotoStrip{display:flex;gap:10px;flex-wrap:wrap;margin:13px 0}
.dailyPhotoStrip img{width:90px;height:75px;object-fit:cover;border-radius:8px;border:1px solid #577490}
.dailyPhotoWrap{position:relative}
.dailyPhotoWrap button{position:absolute;top:0;right:0;padding:2px 7px;background:#563b48}
#dailyEditorMessage{min-height:20px}
@media(max-width:640px){.dailyLine{grid-template-columns:minmax(0,1fr) auto}.dailyLine label{grid-column:1/-1}.dailyLine button{grid-column:2;justify-self:end}.dailyReport{padding:12px}.dailyEntry{flex-wrap:wrap}}

/* Work selector with catalog autocomplete — mobile first */
.dailyLine{grid-template-columns:minmax(0,1fr) auto;gap:13px;background:#1d3146;border:1px solid #58728b;border-radius:13px;padding:16px;margin:14px 0;align-items:start}
.dailyLine>label,.dailyLine>.dailyApprovedFields,.dailyLine>.dailyExtraFields{grid-column:1/-1;min-width:0}
.dailyLine>.dailyCalc{grid-column:1;align-self:center;min-width:0}
.dailyLine>button[data-remove-line]{grid-column:2;align-self:center;justify-self:end}
.dailyFieldsGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dailyFieldsGrid label{min-width:0}
.dailyLine .dailyExtraFields>label{display:grid;gap:8px}
.dailySuggestions{display:grid;gap:6px;margin:8px 0 12px;max-height:310px;overflow-y:auto}
.dailySuggestions[hidden]{display:none!important}
.dailySuggestions button.dailySuggestion{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:#2b4964;color:#edf7ff;border:1px solid #4f7492;padding:12px}
.dailySuggestions button.dailySuggestion:hover{background:#3b5d77}
.dailySuggestion b{font-size:12px;line-height:1.4}
.dailySuggestion small{color:#b9d4e6;font-size:10px;line-height:1.4;text-align:right}
.dailyCalc,.dailyGrand{font-size:12px;font-weight:800;color:#f2b989;line-height:1.6}
.dailyGrand{background:#253b50;border:1px solid #5c7b93;border-radius:11px;padding:13px;margin:12px 0 16px}
.dailyEstimate{margin:10px 0;border-top:1px solid #445d77;padding:10px 0;color:#f1b98c;font-size:12px;line-height:1.5}
.dailyEstimate strong{color:#fff}
.dailyLine .note{font-size:11px;line-height:1.55}
@media(max-width:640px){.dailyFieldsGrid{grid-template-columns:1fr}.dailyLine{padding:12px;gap:10px}.dailySuggestions button.dailySuggestion{align-items:flex-start;flex-direction:column}.dailySuggestion small{text-align:left}.dailyLine>.dailyCalc{grid-column:1}}


/* CONSTRUCTION GROUP · Object workspace redesign */
:root{--bg:#101923;--card:#1b2b3b;--sub:#24384b;--line:#3b536a;--orange:#efa36e}
body{background:linear-gradient(105deg,rgba(10,20,31,.97),rgba(13,26,40,.93) 62%,rgba(12,25,39,.86)),url('/owner-facade.jpg') center/cover fixed}
.wrap{max-width:1160px;padding:18px 22px 80px}
.top{margin-bottom:18px;padding-bottom:14px;min-height:66px}
.brand strong{font-size:14px}
.brand small{font-size:9px}
.symbol{width:43px;height:43px}
.back{font-weight:800;border-color:#4a6881;background:#20354a}
.hero{align-items:center;margin:19px 0 22px;gap:15px}
.hero-text{min-width:0}
.hero h1{font-size:clamp(27px,3vw,38px);letter-spacing:-.045em;margin:8px 0}
.hero-address{font-size:13px;color:#b9cbdc;overflow-wrap:anywhere}
.kicker{font-size:10px;letter-spacing:.19em}
.kicker-dot{color:#8ea9c3;margin:0 5px}
.chip{border:1px solid #41775c;border-radius:9px;padding:9px 13px;font-size:11px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 28px}
.metric{background:linear-gradient(155deg,#1d3043,#192839);border:1px solid #3a536a;box-shadow:none;border-radius:13px;padding:17px;min-width:0}
.metric-primary{border-color:#976e52;background:linear-gradient(155deg,#2d3540,#202c3a)}
.metric small{font-size:11px;margin:0 0 12px;color:#b8c9d7}
.metric strong{font-size:clamp(18px,2vw,25px);line-height:1.3;display:block;white-space:normal;overflow-wrap:anywhere}
.metric span{display:block;margin-top:9px;font-size:10px;color:#8ea9bf;line-height:1.5}
.workspace-label{font-size:10px;font-weight:800;letter-spacing:.18em;color:#9ab4c9;margin:0 0 10px}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 21px;padding:6px;background:#152638;border:1px solid #354f66;border-radius:13px}
.nav button{min-height:45px;border:1px solid transparent;background:transparent;color:#b9cada;border-radius:9px;padding:10px 12px;font-size:12px;line-height:1.35}
.nav button:hover{background:#2b4258}
.nav button.active{background:#335777;border-color:#678cac;box-shadow:inset 0 -2px #ed9b61;color:white}
.panel{background:linear-gradient(155deg,#1c2d3e,#182737);border:1px solid #3a536c;border-radius:16px;padding:clamp(17px,2.4vw,26px);box-shadow:0 12px 35px #0002}
.overview-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.overview-start,.overview-details{min-width:0}
.panel-eyebrow{display:block;font-size:10px;font-weight:800;letter-spacing:.16em;color:#eea36d;margin-bottom:7px}
.overview-layout .panel h2{font-size:21px;letter-spacing:-.025em}
.overview-layout .note{font-size:11px;line-height:1.75}
.overview-actions{display:grid;gap:10px;margin-top:20px}
.overview-action{display:grid;grid-template-columns:37px minmax(0,1fr) 18px;gap:12px;align-items:center;min-height:77px;text-align:left;padding:12px!important;background:#253c50!important;border:1px solid #45647e!important;border-radius:12px!important}
.overview-action:hover{background:#31516d!important;border-color:#e3a071!important}
.overview-action.primary{background:linear-gradient(110deg,#9c512a,#744326)!important;border-color:#f1a16b!important}
.overview-action.primary:hover{background:#aa5c32!important}
.action-icon{display:grid;place-items:center;background:#314f69;color:#fff;width:37px;height:37px;border-radius:10px;font-size:20px}
.primary .action-icon{background:#c77943}
.overview-action b{display:block;font-size:12px;color:#fff;margin-bottom:4px}
.overview-action small{display:block;color:#c1d3e2;font-size:10px;line-height:1.55;font-weight:500}
.action-arrow{font-size:19px;color:#edaf84}
.overview-details .grid2{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:19px}
.overview-details .data{background:#22364b;border:1px solid #3d5871;padding:13px;border-radius:11px}
.overview-details .data small{font-size:10px;margin-bottom:6px}
.overview-details .data b{font-size:12px;line-height:1.55}
.overview-warning{margin-top:15px}
.overview-warning button{padding:4px 7px;margin-left:5px}
.overview-footnote{margin-top:16px!important;border-top:1px solid #395168;padding-top:13px}
@media(max-width:900px){.overview-layout{grid-template-columns:1fr}.overview-start{order:0}.overview-details{order:1}}
@media(max-width:760px){
 .wrap{padding:10px 13px 60px}
 .top{gap:12px;margin-bottom:15px}
 .back{padding:10px 11px;font-size:11px}
 .hero{margin:14px 0 18px}
 .hero h1{font-size:clamp(25px,7vw,34px)}
 .metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:16px 0 23px}
 .metric{padding:14px 12px}
 .metric small{font-size:10px;min-height:29px;line-height:1.5}
 .metric strong{font-size:clamp(18px,5vw,23px)}
 .metric span{font-size:9px}
 .nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:5px}
 .nav button{min-height:45px;font-size:11px;padding:10px 6px}
 .overview-layout{gap:12px}
 .overview-details .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
 .panel{padding:16px}
 .overview-action{min-height:73px}
}
@media(max-width:410px){.overview-details .grid2{grid-template-columns:1fr}.top .brand strong{font-size:11px}.top .brand small{font-size:8px}}


/* Stage details: accessible accordion and itemized project estimate */
.stage{overflow:hidden}
.stage>button.stage-open{cursor:pointer;min-height:77px;align-items:center;gap:12px;background:linear-gradient(115deg,#28445e,#233c53);padding:17px 19px}
.stage>button.stage-open:hover{background:#335879}
.stage>button.stage-open:focus-visible{outline:3px solid #efa36e;outline-offset:-4px}
.stage-open strong{font-size:15px;line-height:1.5}
.stage-open small{display:block;margin-top:5px;color:#b6ccdc;font-size:11px;line-height:1.55}
.stage-chevron{font-size:25px;transition:transform .18s}
.stage.expanded .stage-chevron{transform:rotate(180deg)}
.stage-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:4px 0 16px}
.stage-summary>div{background:#263e54;border:1px solid #476580;border-radius:10px;padding:12px;min-width:0}
.stage-summary small,.work-numbers small{display:block;font-size:10px;color:#afc3d4;margin-bottom:7px}
.stage-summary strong,.work-numbers strong{font-size:13px;color:#f6f9fc;overflow-wrap:anywhere}
.stage .body{padding:15px}
.work.work-detail{display:block;padding:16px 3px;margin:0;border-top:1px solid #476079}
.work-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}
.work-heading b{font-size:15px}
.work-badge{font-size:10px;color:#b7d6ef;background:#2b4c66;border:1px solid #4b7595;padding:7px 9px;border-radius:8px;white-space:nowrap}
.work-numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:13px}
.work-numbers>div{min-width:0}
.work-detail .progress{margin-bottom:15px}
.work-pricing{display:flex;flex-wrap:wrap;gap:9px 18px;justify-content:space-between;padding:12px 0;border-top:1px solid #344d64;color:#bdd0df;font-size:11px;line-height:1.6}
.work-pricing b{color:#f3b587;display:inline;font-size:12px}
.work-actions{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-top:10px}
.work-actions button{border:1px solid #e5a16c!important;background:#a7582e!important;color:#fff!important;padding:10px 15px!important;border-radius:9px!important;font-weight:800;font-size:11px}
.work-actions button:hover{background:#bf6b38!important}
.work-actions .note{flex:1 1 220px;font-size:10px;line-height:1.55}
@media(max-width:650px){.stage-summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.stage-summary>div{padding:9px 7px}.stage-summary small,.work-numbers small{font-size:9px}.stage-summary strong,.work-numbers strong{font-size:11px}.stage .body{padding:10px}.stage>button.stage-open{padding:14px 12px}.stage-open strong{font-size:13px}.stage-open small{font-size:10px}.work-heading{align-items:flex-start}.work-badge{font-size:9px}.work-numbers{gap:5px}.work-pricing{display:grid;gap:5px}}


.dailyProgressEntry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.dailyProgressEntry .dailyPercentHint{display:block;margin-top:4px;color:#a9c8dd;font-size:10px;line-height:1.5;font-weight:500}
@media(max-width:600px){.dailyProgressEntry{grid-template-columns:1fr;gap:10px}}


/* Daily work totals and separate materials request */
.dailyGrand{display:grid;gap:5px;padding:17px 19px!important;margin:15px 0;border:1px solid #e5a371!important;border-radius:14px;background:linear-gradient(125deg,#283e50,#3c3b40)!important;color:#f5e4d4!important}
.dailyGrand span{font-size:13px;font-weight:750;color:#e9d1bb}
.dailyGrand strong{font-size:clamp(24px,5vw,34px);font-weight:850;line-height:1.25;color:#ffbd85;overflow-wrap:anywhere}
.dailyGrand small{font-size:11px;color:#c9d6e0;line-height:1.65}
.dailyMaterials{border:1px solid #526e84;background:#172a3c;border-radius:13px;margin:20px 0;padding:0 15px}
.dailyMaterials summary{cursor:pointer;list-style:none;padding:17px 2px;font-size:13px;font-weight:800;color:#dcecf8}
.dailyMaterials summary::-webkit-details-marker{display:none}
.dailyMaterials summary::before{content:"▸";display:inline-block;margin-right:10px;color:#f5b17c}
.dailyMaterials[open] summary::before{content:"▾"}
.dailyMaterials summary small{display:block;margin:5px 0 0 23px;color:#9db4c7;font-weight:500;font-size:11px}
.dailyMaterials>.note{margin:0 0 12px}
.dailyMaterials .dailyCashDecision{margin:0 0 15px}
.dailySubmitGuide{border-left:3px solid #f2aa76;padding:12px 15px;background:#253b50;border-radius:0 11px 11px 0;font-size:12px;line-height:1.7;color:#d6e5f1}
.dailySubmitGuide strong{font-size:13px;color:#ffbf8e}
.dailySubmitGuide p{margin:5px 0 0}
@media(max-width:650px){.dailyGrand{padding:15px!important}.dailyForm .actions button{flex:1 1 100%;min-height:47px}}

</style>
